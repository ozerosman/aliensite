# GitHub Pages'e otomatik yayın.
# main dalına her "push" yaptığında site derlenir ve yayınlanır.
name: Siteyi yayinla

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub arayüzünden elle de çalıştırılabilir

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # Sitenin adresi ve alt yolu GitHub tarafından otomatik verilir.
          # Kendi domain'ini bağladığında da doğru değerler gelir; elle değiştirmen gerekmez.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
